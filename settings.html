<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Manager - Settings</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="income.css" />
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <img src="image\logo.png" alt="Expense Manager" />

          <div>
            <h2>Expense Manager</h2>
            <span>Track • Manage • Save</span>
          </div>
        </div>

        <ul class="menu">
          <li onclick="window.location.href = 'index.html'">
            <i class="fa-solid fa-house"></i>
            Dashboard
          </li>

          <li onclick="window.location.href = 'transactions.html'">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            Transactions
          </li>

          <li onclick="window.location.href = 'expense.html'">
            <i class="fa-solid fa-plus"></i>
            Add Expense
          </li>

          <li onclick="window.location.href = 'income.html'">
            <i class="fa-solid fa-wallet"></i>
            Add Income
          </li>

          <li onclick="window.location.href = 'budgets.html'">
            <i class="fa-solid fa-chart-pie"></i>
            Budgets
          </li>

          <li onclick="window.location.href = 'reports.html'">
            <i class="fa-solid fa-chart-line"></i>
            Reports
          </li>

          <li onclick="window.location.href = 'goals.html'">
            <i class="fa-solid fa-bullseye"></i>
            Goals
          </li>

          <li class="active" onclick="window.location.href = 'settings.html'">
            <i class="fa-solid fa-gear"></i>
            Settings
          </li>
        </ul>
      </aside>

      <!-- Main -->
      <main class="main">
        <!-- Top Bar -->
        <header class="topbar">
          <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
          </div>

          <div class="top-right">
            <i class="fa-regular fa-bell"></i>

            <div class="profile">
              <div class="avatar">H</div>
              <span id="topProfileName">Hiten</span>
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>
        </header>

        <!-- Heading -->
        <section class="greeting">
          <h1>Settings ⚙️</h1>

          <p>Manage your Expense Manager preferences.</p>
        </section>

        <!-- Profile Settings -->
        <section class="form-card">
          <div class="title">
            <h2>
              <i class="fa-solid fa-user"></i>
              Profile Settings
            </h2>
          </div>

          <form id="settingsForm">
            <div class="form-group">
              <label> Your Name <span class="required">*</span> </label>

              <input
                type="text"
                id="profileName"
                placeholder="Enter your name"
                required
              />
            </div>

            <div class="form-group">
              <label> Currency </label>

              <select id="currency">
                <option value="₹">₹ - Indian Rupee</option>
                <option value="$">$ - US Dollar</option>
                <option value="€">€ - Euro</option>
                <option value="£">£ - British Pound</option>
              </select>
            </div>

            <div class="button-group">
              <button type="reset" class="reset-btn" id="resetSettings">
                <i class="fa-solid fa-rotate-left"></i>
                Reset
              </button>

              <button type="submit" class="save-btn">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Settings
              </button>
            </div>
          </form>
        </section>

        <!-- Data Management -->
        <section class="form-card">
          <div class="title">
            <h2>
              <i class="fa-solid fa-database"></i>
              Data Management
            </h2>
          </div>

          <p>Manage the financial data stored in this browser.</p>

          <div class="button-group">
            <button type="button" class="reset-btn" id="clearDataBtn">
              <i class="fa-solid fa-trash"></i>
              Clear All Financial Data
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
